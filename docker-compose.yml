services:
  mysql:
    image: mysql:8.0
    container_name: payflux-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: payflux
      MYSQL_DATABASE: payflux
      MYSQL_USER: payflux
      MYSQL_PASSWORD: payflux
    ports:
      - "3306:3306"
    volumes:
      - payflux-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppayflux"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  payflux-mysql-data:
